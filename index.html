<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Тренировка на сегодня</title>
<style>
  :root{
    --bg:#0c0c0e; --card:#161618; --s2:#1e1e22; --s3:#27272c;
    --ink:#f4f4f5; --muted:#9a9aa2; --soft:#c9c9cf; --line:rgba(255,255,255,.08);
    --acc:#f5821f; --acc2:#ff9d4d; --blue:#5aa9e6; --on:#2a1602;
    --grad:linear-gradient(135deg,#ff9d4d,#f5821f);
    --font:Roboto,-apple-system,system-ui,sans-serif;
    --mono:'Roboto Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#050506;font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:var(--acc);text-decoration:none} a:hover{color:var(--acc2)}
  button{font:inherit;border:none;cursor:pointer}
  input[type=date]{color-scheme:dark}
  @keyframes notifIn{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
  @keyframes sheetIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

  #app{position:relative;height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);line-height:1.5;overflow:hidden}
  #main{flex:1;overflow-y:auto;overflow-x:hidden;background-image:radial-gradient(80% 40% at 100% -10%,rgba(245,130,31,.12),transparent 60%),radial-gradient(70% 30% at 0% 0%,rgba(90,169,230,.06),transparent 55%)}
  #nav{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 4px calc(14px + env(safe-area-inset-bottom,0px));background:#121214;border-top:1px solid rgba(255,255,255,.06)}
  #nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
  #nav .pill{width:60px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .25s}
  #nav img{width:22px;height:22px}
  #nav .lab{font-size:12px;letter-spacing:.01em}

  .ov{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
  .ov.on{display:flex}
  #sheet{z-index:30;animation:sheetIn .28s cubic-bezier(.2,.8,.2,1) both}
  #wk{z-index:20;background-image:radial-gradient(90% 45% at 50% 0%,rgba(245,130,31,.14),transparent 70%)}
  #rest{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:flex-end;background:rgba(5,5,6,.55)}
  #rest.on{display:flex}
  #rest .panel{background:var(--card);border-top:1px solid rgba(255,255,255,.1);border-radius:28px 28px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;box-shadow:0 -20px 40px rgba(0,0,0,.5);animation:sheetIn .25s ease both}
  #onb{z-index:50;background-image:radial-gradient(90% 50% at 50% 0%,rgba(245,130,31,.16),transparent 70%)}
  #notif{cursor:pointer;position:absolute;top:6px;left:8px;right:8px;z-index:60;background:#232327;border-radius:24px;padding:14px 16px;display:none;gap:12px;align-items:flex-start;box-shadow:0 16px 40px rgba(0,0,0,.6);animation:notifIn .35s cubic-bezier(.2,.8,.2,1) both}
  #notif.on{display:flex}

  .pad{padding:20px 16px 24px}
  .card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
  .shadow{box-shadow:0 12px 32px -12px rgba(0,0,0,.6)}
  .kicker{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .h1{font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
  .h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .sub{color:var(--muted);font-size:13.5px}
  .p{color:var(--muted);font-size:14.5px;margin:0}
  .primary{background:var(--grad);color:var(--on);width:100%;padding:17px;font-size:17px;font-weight:800;border-radius:16px;box-shadow:0 8px 24px rgba(245,130,31,.28);transition:transform .12s ease}
  .primary:active,.press:active{transform:scale(.98)}
  .ghost{background:var(--s2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
  .acc-head{cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .acc-head>span:first-child{display:flex;align-items:center;gap:11px}
  .acc-ic{flex:none;width:32px;height:32px;border-radius:10px;background:rgba(245,130,31,.13);display:flex;align-items:center;justify-content:center}
  .acc-ic img{width:18px;height:18px}
  .chev{color:var(--muted);display:inline-block;transition:transform .2s}
  .chev.up{transform:rotate(180deg)}
  .scheme{font-family:var(--mono);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap;color:var(--acc);background:rgba(245,130,31,.12);border:1px solid rgba(245,130,31,.35)}
  .scheme.dl{color:var(--blue);background:rgba(90,169,230,.12);border-color:rgba(90,169,230,.35)}
  .ready-tag{color:var(--blue);background:rgba(90,169,230,.12);border:1px solid rgba(90,169,230,.35);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .vid{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-size:14px;font-weight:700}
  .vid i{font-style:normal;font-size:.72em}
  .sw{flex:none;position:relative;width:52px;height:32px;border-radius:16px;background:var(--s3);transition:background .2s}
  .sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:left .2s}
  .sw.on{background:var(--acc)} .sw.on i{left:24px;background:var(--on)}
  .opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .opts button{padding:11px 0;border-radius:12px;font-weight:700;font-family:var(--mono);font-size:14px;background:var(--s2);color:var(--ink);border:1px solid var(--line)}
  .opts button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
  .row-line{border-top:1px solid var(--line)}
  .step{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;border:1px solid transparent}
  .step .n{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--s3);color:var(--muted)}
  .step .t{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
  .step.past .n{background:rgba(245,130,31,.2);color:#f6d8b4} .step.past .t{color:var(--soft)}
  .step.cur{background:rgba(245,130,31,.12);border-color:rgba(245,130,31,.35)}
  .step.cur .n{background:var(--acc);color:var(--on)} .step.cur .t{color:var(--ink)}
  .step.big{padding:10px 12px;border-radius:12px} .step.big:not(.cur){background:var(--card);border-color:rgba(255,255,255,.06)}
  .step.big .n{width:24px;height:24px} .step.big .t{font-size:14px}
  .tag-cur{color:var(--acc);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .back{flex:none;width:40px;height:40px;border-radius:50%;background:var(--s2);border:1px solid var(--line);color:var(--ink);font-size:22px;line-height:1}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .ok-ic{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
  .hint-blue{background:rgba(90,169,230,.12);border:1px solid rgba(90,169,230,.3);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  ol.list{margin:0;padding-left:20px;color:var(--muted);font-size:14px} ol.list li{margin:3px 0}
  .small-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
  .wk-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;padding:0;line-height:1;transition:transform .1s}
  .wk-cell:active{transform:scale(.92)}
  .wk-cell .dots{display:flex;gap:3px} .wk-cell .dots i{width:5px;height:5px;border-radius:50%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:4px 0 18px}
  .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{display:block}
  .setbtn{min-width:52px;height:52px;padding:0 8px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:background .25s}
  .setbtn b{font-weight:800;font-size:16px;font-family:var(--mono)} .setbtn small{font-size:9.5px;font-weight:700;opacity:.75}
  .stepper{flex:none;width:56px;height:56px;border-radius:16px;background:var(--s3);color:var(--ink);font-size:26px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div id="main"></div>
  <nav id="nav"></nav>
  <div id="sheet" class="ov"></div>
  <div id="wk" class="ov"><div id="wkInner" style="display:flex;flex-direction:column;flex:1;min-height:0"></div><div id="rest"></div></div>
  <div id="onb" class="ov"></div>
  <div id="notif" data-a="notifTap"></div>

<script>

const uri = s => "data:image/svg+xml;utf8,"+encodeURIComponent(s);
const ICON = {}; for (const k in GLYPH) ICON[k] = uri(GLYPH[k]);

const SCHEMES = {
  reps:["4×8–12","4×6–8","4×5–8","5×4–6"],
  ballistic:["4×15","5×12–15","5×10","6×8–10"],
  skill:["3×20–30 сек","4×30–40 сек","4×макс, медленно","5×удержание"],

  "Скил: флажок (human flag)":RT("6b9e1c47a3a0e433459ecfe148892888"),
  "Подтягивания (верт. тяга)":RT("690e3232c3edd5eff117eb699dd63db2"),

  "Свинг / рывок гири":RT("88ebdb6109a078e52bd426dd65528230"),

  "Кор: планка / подъём ног":RT("b8dae93a6974afeebd7d356c6ef08047")
};
const VARIANT_VIDEO = {
  "Ролик для пресса с колен":RT("73006a38b9c5cce2ca96f54e8af878fd"),
  "Ролик стоя (негативы) + L-sit удержание":RT("73006a38b9c5cce2ca96f54e8af878fd"),

  "Рывок 16 на повторы / комбо 2×16":RT("022cd5547b8a5b1cbd36593001c86dd6"),

};
const EX_ICON = {
  "Скил: передний вис (front lever)":"frontlever","Скил: флажок (human flag)":"flag",
  "Подтягивания (верт. тяга)":"bar","Тяга в наклоне / на кольцах":"rings",
  "Жим стоя (верт. жим)":"kettlebell","Кор: ролик / L-sit":"core",
  "Скил: стойка на руках (handstand)":"handstand","Свинг / рывок гири":"kettlebell",

  "Тяга на кольцах к поясу (гориз. тяга)":"rings","Толчок гири":"kettlebell","Кор: планка / подъём ног":"core"
};
const VARIANT_ICON = {"Тяга одной гири 16 в наклоне":"kettlebell","Тяга двух гирь 2×16 в наклоне":"kettlebell"};

const DAYS = [
 {code:"A",name:"Верх — тяга-акцент",ex:[
  {kind:"skill",label:"Скил: передний вис (front lever)",variants:["Передний вис «подтянутый» (tuck)","Передний вис: продвинутый tuck","Передний вис: одна нога / straddle","Передний вис: полный (копи удержание)"],
   tip:"Руки прямые, лопатки и таз подкручены, тело как доска; в tuck колени подтянуты к груди. Время в плашке набирай короткими чистыми вхождениями (по 5–10 сек за раз), а не одним долгим удержанием. Это твой целевой тяговый скил — тренируй его каждую неделю (без чередования, чтобы был прогресс). Хочешь разнообразия — иногда заменяй на флажок (прогрессия в справочнике усложнения)."},
  {kind:"reps",label:"Подтягивания (верт. тяга)",variants:["Подтягивания (полные, чисто)","Подтягивания с паузой 1 сек вверху","Подтягивания «лучник» / разнохват","Взвешенные подтягивания (гиря 16 в ногах)"],

  {kind:"reps",label:"Тяга в наклоне / на кольцах",variants:["Тяга одной гири 16 в наклоне","Тяга двух гирь 2×16 в наклоне","Горизонтальная тяга на кольцах (ноги дальше)","Тяга на кольцах к поясу + пауза"],

 {code:"B",name:"Низ + баллистика",ex:[

   tip:"Руки прямые, пальцы активно «гребут» пол, тело вытянуто, рёбра не вываливай. Время в плашке набирай короткими чистыми вхождениями, а не одним долгим. На день ног верх свежий — поэтому скил здесь. Падать учись уходом в сторону/кувырком."},
  {kind:"ballistic",label:"Свинг / рывок гири",variants:["Двуручный свинг 16","Одноручный свинг 16","Рывок гири 16 (snatch)","Рывок 16 на повторы / комбо 2×16"],

const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const isTD=d=>[1,3,5].includes(d.getDay());
const pad=n=>n<10?'0'+n:''+n;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

function beep(f,d){
  if(!S.sound||!AC)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

// число тренировочных дней в [start, t)
function before(start,t){let c=0,cur=sod(start),g=0;while(cur<t&&g<4000){if(isTD(cur))c++;cur=add(cur,1);g++;}return c;}
function session(){
  const start=fromISO(S.start),today=sod(new Date());
  let idx,isRest=false,refDate=today;
  if(today>=start&&isTD(today))idx=before(start,today);
  else{
    let nd=today<start?start:add(today,1),g=0;
    while(!(nd>=start&&isTD(nd))&&g<14){nd=add(nd,1);g++;}
    idx=before(start,nd);refDate=nd;isRest=true;
  }
  return {idx:Math.max(0,idx+S.offset),isRest,refDate};
}
function decode(idx){const wa=Math.floor(idx/3);return {year:Math.floor(wa/52)+1,week:(wa%52)+1,dayIndex:idx%3};}
function blockInfo(w){if(w>=49)return {idx:'test',within:w-48};return {idx:w<=12?0:w<=24?1:w<=36?2:3,within:((w-1)%12)+1};}
function scheme(kind,bi,dl,test){
  const base=SCHEMES[kind][bi==='test'?3:bi];
  if(dl){const p=base.split('×');return p.length===2?'2×'+p[1]+' · разгрузка':'2 подхода · разгрузка';}
  return test?base+' · тест/легко':base;
}
function parse(sc,kind){
  const m=sc.match(/^(\d+)×/),r=sc.match(/(\d+)–(\d+)/),one=sc.match(/×(\d+)(?!–)/);
  const hold=/сек/.test(sc)||kind==='skill';
  let lo=r?+r[1]:one?+one[1]:null,hi=r?+r[2]:lo;
  if(hi==null){hi=hold?30:10;lo=hold?20:6;}
  return {sets:m?+m[1]:1,lo,hi,hold,unit:hold?'сек':/\/рук/.test(sc)?'на руку':'повт'};
}
function build(week,di){
  const b=blockInfo(week),isTest=b.idx==='test',isDeload=!isTest&&b.within%4===0;
  const vi=isTest?3:b.idx,day=DAYS[di];
  return {
    code:day.code,dayName:day.name,week,isTest,isDeload,vi,di,
    blockName:isTest?'Разгрузка и тест':BLOCKS[b.idx].name,
    blockFocus:isTest?'Лёгкая работа и проверка результата перед новым кругом.':BLOCKS[b.idx].focus,
    exercises:day.ex.map((e,ei)=>{
      const nm=e.variants[vi],sc=scheme(e.kind,b.idx,isDeload,isTest);
      return {ei,label:e.label,name:nm,scheme:sc,tip:e.tip,icon:exIcon(e.label,nm),video:videoFor(e.label,nm),nextName:e.variants[vi+1]||'Год 2 — со сложных вариантов',...parse(sc,e.kind)};
    })
  };
}
let _sk=null,_sch=null;
function schedule(){
  if(_sk===S.start)return _sch;
  const out=[];let d=fromISO(S.start),g=0;
  while(out.length<160&&g<500){if(isTD(d))out.push(d);d=add(d,1);g++;}
  _sk=S.start;_sch=out;return out;
}

/* Общий контекст для всех экранов */
function ctx(){
  const sess=session(),dec=decode(sess.idx),browsing=S.browseWeek!==null;
  const week=browsing?S.browseWeek:dec.week,di=browsing?S.browseDay:dec.dayIndex;
  const w=build(week,di),rest=!browsing&&sess.isRest;
  const today=sod(new Date()),todayISO=iso(today),logged=!browsing&&!rest&&S.log[todayISO];
  const curBlock=blockInfo(dec.week).idx,curVi=curBlock==='test'?3:curBlock;
  const since=fromISO(SINCE),sch=schedule(),pastTD=sch.filter(d=>d<today&&d>=since),lastTD=pastTD[pastTD.length-1];
  const lastISO=lastTD&&iso(lastTD);
  const missedOn=!browsing&&lastTD&&!S.log[lastISO]&&S.dismissed!==lastISO&&!S.wk;
  let missed=null;
  if(missedOn){const k=Math.max(0,before(fromISO(S.start),lastTD)+S.offset);missed=decode(k);const mw=build(missed.week,missed.dayIndex);missed.line=fmtDate(lastTD)+' · День '+mw.code+' · '+mw.dayName;}
  return {sess,dec,browsing,week,di,w,rest,today,todayISO,logged,curBlock,curVi,since,sch,pastTD,lastISO,missed};
}

    <img src="${rest?'athlete-run.webp':'athlete-kb.webp'}" alt="" style="position:absolute;right:-6px;bottom:0;max-height:232px;max-width:172px;z-index:0;pointer-events:none;filter:brightness(1.14) contrast(1.05) drop-shadow(0 0 16px rgba(255,165,75,.5))">
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#15171c 42%,rgba(21,23,28,.42) 60%,rgba(21,23,28,0) 74%)"></div>
    <div style="position:relative;z-index:2">
      <div class="kicker">${rest?'Сегодня отдых':browsing?'Просмотр':'Тренировка на сегодня'}</div>
      <h1 style="font-size:28px;margin:.28em 0 .06em;line-height:1.04;letter-spacing:-.02em;font-weight:800;text-wrap:pretty">${rest?'День отдыха':'День '+w.code+' · '+esc(w.dayName)}</h1>
      <div style="color:var(--muted);font-size:15px;font-weight:500;text-transform:capitalize">${browsing?'':fmtDate(new Date())}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">${badges.map(b=>`<span style="display:inline-flex;align-items:center;gap:6px;background:${b.bg};color:${b.color};font-size:12px;font-weight:700;letter-spacing:.02em;padding:6px 12px;border-radius:999px;white-space:nowrap;border:1px solid ${b.border}"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>${esc(b.t)}</span>`).join('')}</div>
      <div style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px"><span>Прогресс года</span><span>${week} / 52</span></div>
      <div style="height:8px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden"><i style="display:block;height:100%;border-radius:999px;background:var(--grad);width:${Math.round(week/52*100)}%"></i></div></div>
    </div></header>`;
  if(rest){
    h+=`<div class="card shadow" style="padding:26px 18px;text-align:center">
      <div class="muted">Восстанавливайся 💆</div>
      <div style="font-size:22px;font-weight:800;margin:10px 0;letter-spacing:-.02em">Сегодня день отдыха</div>
      <div class="muted" style="font-size:15px">Следующая по графику: ${fmtDate(sess.refDate)} · День ${w.code}</div>
      <button data-a="peekPrev" class="primary" style="margin-top:16px;padding:15px;font-size:16px;font-weight:700;border-radius:14px">Вернуться к прошлой тренировке · День ${pw.code}</button>
      <div class="sub" style="margin-top:10px">Пропустил тренировку и хочешь нагнать сегодня — открой её здесь.</div></div>`;
    return h+'</div>';
  }
  if(browsing)h+=`<div style="display:flex;gap:6px;margin:0 0 14px">${DAYS.map((d,i)=>{const a=i===c.di;return `<button data-a="day" data-i="${i}" style="flex:1;background:${a?'var(--acc)':'var(--s2)'};border:1px solid ${a?'var(--acc)':'var(--line)'};border-radius:12px;padding:9px;font-weight:700;font-size:14px;color:${a?'var(--on)':'var(--muted)'}">День ${d.code}</button>`;}).join('')}</div>`;
  if(logged)h+=`<div style="display:flex;align-items:center;gap:12px;background:rgba(90,169,230,.12);border:1px solid rgba(90,169,230,.3);border-radius:16px;padding:14px 16px;margin-bottom:14px"><span class="ok-ic" style="background:var(--blue);color:var(--bg)">✓</span><div style="min-width:0"><div style="font-weight:700">Тренировка выполнена</div><div class="sub">${logged.dur} мин · ${logged.sets} подходов</div></div></div>`;
  h+=`<button data-a="startWk" class="primary" style="display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.01em;border-radius:18px;margin-bottom:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="#2a1602"><path d="M7 4.5v15l12-7.5z"></path></svg>${logged?'Пройти ещё раз':browsing?'Начать эту тренировку':'Начать тренировку'}</button>`;
  h+=`<div class="card shadow"><h2 class="h2">${esc(w.blockName)}</h2><p class="p">${esc(w.blockFocus)}</p></div>`;
  h+=accordion('warm','Разминка',ICON.warmup,S.openWarm,WARMUP);
  h+=`<div class="card shadow"><h2 class="h2">Основная часть</h2><p class="p">Отдых между подходами 1.5–3 мин. Техника важнее веса.</p>`;
  w.exercises.forEach((e,i)=>{
    const open=S.openEx===i,ll=lastLine(e);
    h+=`<div style="background:var(--s2);border:1px solid var(--line);border-radius:16px;margin:12px 0 0;overflow:hidden;box-shadow:0 4px 16px -10px rgba(0,0,0,.6)">
      <div data-a="ex" data-i="${i}" style="display:flex;align-items:flex-start;gap:12px;padding:14px;cursor:pointer;user-select:none">
        <span style="flex:none;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--s3);border:1px solid var(--line)"><img src="${e.icon}" alt="" style="width:38px;height:38px"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
          <span style="display:flex;align-items:flex-start;gap:10px">
            <span style="flex:1;min-width:0;font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.35;overflow-wrap:break-word">${esc(e.name)}</span>
            <span style="flex:none;position:relative;width:30px;height:30px;border-radius:50%;margin-top:1px;border:1px solid ${open?'var(--acc)':'var(--line)'};background:${open?'var(--acc)':'transparent'}">
              <span style="position:absolute;top:50%;left:50%;width:12px;height:2px;border-radius:2px;background:${open?'var(--on)':'var(--muted)'};transform:translate(-50%,-50%)"></span>
              <span style="position:absolute;top:50%;left:50%;width:2px;height:12px;border-radius:2px;background:${open?'var(--on)':'var(--muted)'};opacity:${open?0:1};transform:translate(-50%,-50%)"></span>
            </span>
          </span>
          <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="scheme${dlc(w.isDeload)}">${esc(e.scheme)}</span>${ready(e)?'<span class="ready-tag">↑ Пора усложнить</span>':''}</span>
          ${ll?`<span style="color:var(--muted);font-size:12.5px;margin-top:-4px">Прошлый раз: <span class="mono" style="color:var(--soft)">${esc(ll)}</span></span>`:''}
        </span>
      </div>
      ${open?`<div style="padding:0 14px 14px"><p style="margin:0 0 12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px">${esc(e.tip)}</p>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">${e.video?`<a class="vid" href="${e.video}" target="_blank" rel="noopener"><i>▶</i>Видео техники</a>`:''}
        <button data-a="sheet" data-di="${c.di}" data-ei="${i}" data-w="${week}" style="background:var(--s3);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px;margin-left:auto">Подробнее →</button></div></div>`:''}
    </div>`;
  });
  h+='</div>';
  h+=accordion('cool','Заминка',ICON.cooldown,S.openCool,COOLDOWN);
  return h+'</div>';
}
function accordion(k,title,ic,open,body){
  return `<div class="card shadow" style="padding:16px 18px"><div class="acc-head" data-a="${k}"><span><span class="acc-ic"><img src="${ic}" alt=""></span>${title}</span><span class="chev${open?' up':''}">▾</span></div>${open?`<div class="muted" style="margin-top:14px;font-size:15px">${esc(body)}</div>`:''}</div>`;
}

function viewProgram(c){
  const {dec,today,todayISO,pastTD,sch,since,curBlock}=c;
  let done=0,miss=0,streak=0,open=true;
  for(let k=pastTD.length-1;k>=0;k--){const ok=!!S.log[iso(pastTD[k])];if(ok)done++;else miss++;if(open){if(ok)streak++;else if(k!==pastTD.length-1||S.log[todayISO])open=false;}}
  const yearBase=(dec.year-1)*156;
  let h=`<div class="pad"><div class="kicker">52 недели · 4 блока</div><h1 class="h1" style="margin:4px 0 14px">Программа на год</h1>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px">${[[done,'выполнено','var(--acc)'],[miss,'пропущено','var(--blue)'],[streak,'серия подряд','var(--ink)']].map(([v,k,col])=>`<div class="stat" style="padding:12px 12px 10px"><div class="mono" style="font-size:22px;font-weight:700;color:${col};line-height:1.1">${v}</div><div class="muted" style="font-size:12px;margin-top:2px">${k}</div></div>`).join('')}</div>`;
  for(let bi=0;bi<5;bi++){
    const from=bi*12+1,to=bi===4?52:from+11;
    const name=bi===4?'Разгрузка и тест':BLOCKS[bi].name,focus=bi===4?'Лёгкая работа и проверка результата перед новым кругом.':BLOCKS[bi].focus;
    let cells='';
    for(let n=from;n<=to;n++){
      const b=blockInfo(n),dl=b.idx!=='test'&&b.within%4===0,isCur=n===dec.week,past=n<dec.week;
      let s={bg:'var(--s2)',border:'var(--line)',color:'var(--muted)',shadow:'none'};
      if(dl||b.idx==='test')s={bg:'repeating-linear-gradient(45deg,#26262b 0 4px,#1a1a1e 4px 8px)',border:'var(--line)',color:'var(--blue)',shadow:'none'};
      if(past)s={bg:'rgba(245,130,31,.16)',border:'rgba(245,130,31,.22)',color:'#f6d8b4',shadow:'none'};
      if(isCur)s={bg:'var(--acc)',border:'var(--acc)',color:'var(--on)',shadow:'0 0 0 2px rgba(245,130,31,.42)'};
      const dots=[0,1,2].map(j=>{
        const d=sch[yearBase+(n-1)*3+j-S.offset],isPast=d&&d<today&&d>=since;
        if(d&&S.log[iso(d)])return `<i style="background:${isCur?'var(--on)':'var(--acc)'}"></i>`;
        if(isPast)return `<i style="box-shadow:inset 0 0 0 1.2px ${isCur?'var(--on)':'var(--blue)'}"></i>`;
        return `<i style="background:${isCur?'rgba(42,22,2,.28)':'rgba(255,255,255,.14)'}"></i>`;
      }).join('');
      cells+=`<button class="wk-cell" data-a="week" data-n="${n}" style="background:${s.bg};border-color:${s.border};color:${s.color};box-shadow:${s.shadow}"><span>${n}</span><span class="dots">${dots}</span></button>`;
    }
    h+=`<div class="card" style="padding:16px;margin-bottom:12px;border-color:${bi===curBlock?'rgba(245,130,31,.35)':'var(--line)'}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px"><div style="font-weight:700;font-size:16px;letter-spacing:-.01em">${esc(name)}</div><div class="mono muted" style="font-size:12px;white-space:nowrap">нед. ${from}–${to}</div></div>
      <div class="sub" style="margin-bottom:12px">${esc(focus)}</div>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px">${cells}</div></div>`;
  }
  h+=`<div class="legend"><span><i style="width:11px;height:11px;border-radius:4px;background:var(--acc)"></i>текущая неделя</span><span><i style="width:6px;height:6px;border-radius:50%;background:var(--acc)"></i>выполнено</span><span><i style="width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.2px var(--blue)"></i>пропущено</span><span><i style="width:11px;height:11px;border-radius:4px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,#26262b 0 3px,#1a1a1e 3px 6px)"></i>разгрузка</span></div>`;
  h+=`<div class="card" style="padding:16px 18px;margin-bottom:0"><div class="acc-head" data-a="how"><span><span class="acc-ic"><img src="${icon(SEC.how,'#f5821f')}" alt=""></span>Как это работает</span><span class="chev${S.openHow?' up':''}">▾</span></div>
    ${S.openHow?`<ul style="margin:14px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:6px">
      <li><b style="color:var(--ink)">Прогрессия калистеники:</b> делаешь вариант, который можешь чисто. Дошёл до верха повторов во всех подходах 2 тренировки подряд → следующий вариант.</li>
      <li><b style="color:var(--ink)">Прогрессия гири:</b> работаешь в диапазоне повторов. Добил верх во всех подходах → усложняй вариант (одноручный → двойной → темп). Тяжелее 16 кг не нужно.</li>
      <li><b style="color:var(--ink)">Разгрузка:</b> каждая 4-я неделя блока — 2 подхода, без отказа. Это часть прогресса, связки восстанавливаются.</li>
      <li><b style="color:var(--ink)">Тест:</b> недели 49–52 — лёгкая работа и проверка результата перед новым годовым кругом.</li>
      <li>Каждая тренировка: разминка 8–10 мин → основная часть → заминка 5–10 мин.</li></ul>`:''}</div>`;
  return h+'</div>';
}

function viewProg(c){
  const {dec,curVi}=c;
  let h=`<div class="pad"><div class="kicker">Не вес, а вариант движения</div><h1 class="h1" style="margin:4px 0 6px">Усложнение</h1>
    <p class="p" style="margin:0 0 16px">Добил верх повторов во всех подходах 2 тренировки подряд — переходи к следующему варианту.</p>
    <div style="display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px">${[['program','По программе'],['moves','Движения'],['skills','Скилы']].map(([k,l])=>`<button data-a="progTab" data-k="${k}" style="flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13.5px;background:${S.progTab===k?'var(--s3)':'transparent'};color:${S.progTab===k?'var(--ink)':'var(--muted)'}">${l}</button>`).join('')}</div>`;
  if(S.progTab==='program'){
    DAYS.forEach((d,ddi)=>{
      const bw=build(dec.week,ddi);
      h+=`<div style="margin-bottom:18px"><div style="font-weight:800;font-size:15px;margin:0 0 8px;letter-spacing:-.01em">День ${d.code} · ${esc(d.name)}</div>`;
      d.ex.forEach((e,ei)=>{
        h+=`<div class="press" data-a="sheet" data-di="${ddi}" data-ei="${ei}" data-w="${dec.week}" style="cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;transition:transform .12s">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><img src="${exIcon(e.label,e.variants[curVi])}" alt="" style="width:26px;height:26px"><div style="flex:1;min-width:0;font-weight:700;font-size:14.5px">${esc(e.label)}</div>${ready(bw.exercises[ei])?'<span style="color:var(--blue);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em">↑ готов</span>':''}<span class="muted" style="font-size:18px">›</span></div>
          <div style="display:flex;flex-direction:column;gap:4px">${ladder(e,curVi,false)}</div></div>`;
      });
      h+='</div>';
    });
  } else if(S.progTab==='moves'){
    GENERAL.forEach(g=>{h+=`<div class="small-card"><div style="font-weight:700;font-size:14.5px;margin-bottom:6px">${esc(g.nm)}</div><ol class="list">${g.items.map(it=>`<li>${esc(it)}</li>`).join('')}</ol></div>`;});
  } else {
    h+='<p style="margin:0 0 12px;color:var(--muted);font-size:14px">Статические силовые элементы. Делай первым в тренировке, на свежие силы, короткими чистыми подходами. Прогресс месяцами — это норма.</p>';
    SKILLS.forEach(g=>{h+=`<div class="small-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><div style="font-weight:700;font-size:14.5px">${esc(g.nm)}</div><a class="vid" href="${g.video}" target="_blank" rel="noopener" style="flex:none;font-size:13px"><i>▶</i>Видео</a></div><ol class="list">${g.items.map(it=>`<li>${esc(it)}</li>`).join('')}</ol></div>`;});
    h+='<p style="margin:4px 0 0;color:var(--muted);font-size:13px">Флажок: опора — вертикальная стойка шведской стенки.</p>';
  }
  return h+'</div>';
}

function viewSettings(){
  const keys=Object.keys(S.log).sort().reverse();
  const hist=keys.slice(0,6).map(k=>{const x=S.log[k];return `<div class="row-line" style="display:flex;align-items:center;gap:12px;padding:10px 0"><span style="flex:none;width:36px;height:36px;border-radius:10px;background:rgba(245,130,31,.13);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center">${x.code}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px;text-transform:capitalize">${fmtDate(fromISO(k))}</div><div class="muted" style="font-size:13px">Неделя ${x.week} · ${x.dur} мин · ${x.sets} подходов</div></div></div>`;}).join('');

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px"><div style="min-width:0"><div style="font-weight:600;font-size:15px">Сдвиг тренировок</div><div class="muted" style="font-size:13px">Пропустил или сделал лишнюю</div></div>

    ${S.remind.on?`<div class="opts" style="margin-top:14px">${timeOpts()}</div>
    <p class="sub" style="margin:12px 0 0">Если тренировка не отмечена до вечера — придёт второе напоминание с предложением сдвинуть график.</p>

function startWorkout(){
  const c=ctx(),w=c.w;
  const val=w.exercises.map(ex=>{const l=(S.perf[ex.name]||[]).slice(-1)[0];return l?(l.r[0]??ex.hi):ex.hi;});
  set({sheet:null,wk:{week:w.week,di:w.di,step:0,reps:w.exercises.map(()=>[]),val,restEnd:null,restTotal:0,startedAt:Date.now(),holdStart:null},now:Date.now()});
}
function finish(w){
  const wk=S.wk,dur=Math.max(1,Math.round((Date.now()-wk.startedAt)/60000)),sets=wk.reps.reduce((a,b)=>a+b.length,0);
  const d=iso(new Date());
  S.log={...S.log,[d]:{code:w.code,week:w.week,dur,sets}};
  const perf={...S.perf};
  w.exercises.forEach((ex,i)=>{if(wk.reps[i].length)perf[ex.name]=[...(perf[ex.name]||[]),{d,r:wk.reps[i]}];});
  S.perf=perf;save('trn_log',S.log);save('trn_perf',S.perf);
  setWk({step:wk.step+1,dur,sets,restEnd:null,holdStart:null});signal();
}
function mainAction(){
  const wk=S.wk,w=build(wk.week,wk.di),n=w.exercises.length;
  if(wk.step===n+2){set({wk:null});toTop();return;}
  if(wk.step===n+1){finish(w);return;}
  if(wk.step===0){setWk({step:1});return;}
  const i=wk.step-1,ex=w.exercises[i];
  if(wk.reps[i].length<ex.sets){
    let v=wk.val[i];
    if(wk.holdStart)v=Math.round((Date.now()-wk.holdStart)/1000);
    const reps=wk.reps.slice();reps[i]=[...reps[i],v];
    const val=wk.val.slice();val[i]=v;
    const lastAll=reps[i].length>=ex.sets&&i===n-1;
    setWk({reps,val,holdStart:null,restEnd:lastAll?null:Date.now()+S.restSec*1000,restTotal:S.restSec});
  } else setWk({step:wk.step+1,holdStart:null});
}
// Живые значения (обновляются таймером без полной перерисовки)
function wkLive(){
  const wk=S.wk,ww=build(wk.week,wk.di),n=ww.exercises.length,step=wk.step,now=S.now;
  const resting=!!wk.restEnd&&step>=1&&step<=n,left=resting?(wk.restEnd-now)/1000:0;
  const o={ww,n,step,resting,left,
    elapsed:mmss(((step===n+2?wk.startedAt+wk.dur*60000:now)-wk.startedAt)/1000),
    ring:resting?(628.32*(1-Math.max(0,left)/wk.restTotal)).toFixed(1):0,restLeft:mmss(left)};
  if(step>=1&&step<=n){
    const i=step-1,ex=ww.exercises[i],d=wk.reps[i].length,allDone=d>=ex.sets;
    const holding=!!wk.holdStart,hs=holding?(now-wk.holdStart)/1000:0;
    o.i=i;o.ex=ex;o.d=d;o.allDone=allDone;o.holding=holding;o.hs=hs;
    o.val=holding?Math.floor(hs):wk.val[i];
    o.holdClock=mmss(holding?Math.floor(hs):0);
    o.holdPct=Math.min(100,(holding?hs:wk.val[i])/ex.hi*100).toFixed(1)+'%';
    o.holdBar=(holding?hs:wk.val[i])>=ex.hi?'var(--blue)':'var(--grad)';
    o.mainLabel=allDone?(i===n-1?'К заминке →':'Следующее упражнение →'):'Записать подход '+(d+1)+' · '+o.val+' '+(ex.hold?'сек':ex.unit);
  } else o.mainLabel=step===0?'Начать основную часть →':step===n+1?'Завершить тренировку':'Готово';
  return o;
}

    <div style="display:flex;flex-direction:column;gap:8px;width:100%;text-align:left">${[['52','недели: 4 блока по 12 + разгрузка и тест'],['3×','в неделю — Пн, Ср, Пт, full-body A/B/C'],['~50′','на тренировку, разминка и заминка включены']].map(([k,t])=>`<div style="display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px"><span class="mono" style="flex:none;font-weight:700;color:var(--acc);min-width:44px">${k}</span><span style="font-size:14.5px;color:var(--soft)">${t}</span></div>`).join('')}</div></div>`;
  if(st===1)body=`<div class="kicker">Шаг 1 из 3</div><h1 class="h1" style="margin:6px 0 8px">Когда начинаем?</h1>
    <p class="muted" style="font-size:15px;margin:0 0 20px">Дата старта — это неделя 1. Дальше «сегодня» считается само по календарю: Пн, Ср, Пт.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${[[iso(mon),'С этой недели',mon],[iso(nextMon),'Со следующей недели',nextMon]].map(([v,t,d])=>{const a=os===v;
      return `<button data-a="obPick" data-k="${v}" style="display:flex;align-items:center;gap:12px;text-align:left;background:${a?'rgba(245,130,31,.1)':'var(--card)'};border:1px solid ${a?'rgba(245,130,31,.4)':'var(--line)'};border-radius:16px;padding:14px 16px;color:var(--ink)"><span style="flex:none;width:20px;height:20px;border-radius:50%;border:2px solid ${a?'var(--acc)':'var(--muted)'};display:flex;align-items:center;justify-content:center"><i style="width:10px;height:10px;border-radius:50%;background:${a?'var(--acc)':'transparent'}"></i></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:15px">${t}</span><span class="muted" style="display:block;font-size:13px">Понедельник, ${fmtDate(d,{day:'numeric',month:'long'})}</span></span></button>`;}).join('')}</div>
    <label style="display:block;margin:0 0 6px;font-size:13.5px;color:var(--muted);font-weight:500">Или выбери дату</label>
    <input type="date" value="${os}" data-c="obSetStart" style="font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--s2);color:var(--ink)">`;
  if(st===2){const ic=GEAR_IC();body=`<div class="kicker">Шаг 2 из 3</div><h1 class="h1" style="margin:6px 0 8px">Инвентарь</h1>
    <p class="muted" style="font-size:15px;margin:0 0 20px">Программа рассчитана на этот набор. Гири — две по 16 кг: прогрессия идёт повторами и вариантом, не весом.</p>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${GEAR.map((t,i)=>{const on=S.gear.includes(i);
      return `<button data-a="gear" data-i="${i}" style="display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:${on?'rgba(245,130,31,.08)':'var(--card)'};border:1px solid ${on?'rgba(245,130,31,.35)':'var(--line)'};border-radius:16px;padding:14px;color:var(--ink);min-height:96px"><span style="display:flex;width:100%;justify-content:space-between;align-items:center"><img src="${ic[i]}" alt="" style="width:28px;height:28px"><span style="width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;background:${on?'var(--acc)':'transparent'};color:var(--on);border:1.5px solid ${on?'var(--acc)':'var(--muted)'}">${on?'✓':''}</span></span><span style="font-weight:700;font-size:14px;line-height:1.25">${t}</span></button>`;}).join('')}</div>
    ${S.gear.length<6?'<p style="color:var(--blue);font-size:13.5px;margin:14px 0 0">Без части инвентаря некоторые упражнения придётся заменять — подсказки по замене есть в «Усложнении».</p>':''}`;}
  if(st===3)body=`<div class="kicker">Шаг 3 из 3</div><h1 class="h1" style="margin:6px 0 8px">Напоминания</h1>
    <p class="muted" style="font-size:15px;margin:0 0 20px">В дни тренировок пришлём уведомление с тем, что делать сегодня.</p>
    <div data-a="remind" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px"><div><div style="font-weight:700">Напоминать</div><div class="muted" style="font-size:13px">Пн, Ср, Пт</div></div>${sw(S.remind.on)}</div>
    ${S.remind.on?`<div class="opts">${timeOpts()}</div>`:''}`;
  return `<div style="flex:none;display:flex;align-items:center;gap:12px;padding:14px 20px 0;height:54px">${st>0?'<button data-a="obBack" style="background:none;color:var(--muted);font-weight:700;font-size:14px;padding:0">‹ Назад</button>':''}<div style="flex:1"></div>
    <div style="display:flex;gap:6px">${[0,1,2,3].map(i=>`<i style="width:${i===st?'22px':'6px'};height:6px;border-radius:3px;background:${i<=st?'var(--acc)':'rgba(255,255,255,.15)'};transition:width .25s,background .25s"></i>`).join('')}</div></div>
  <div data-scroll="onb" style="flex:1;overflow-y:auto;padding:20px 24px">${body}</div>
  <div style="flex:none;padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px))"><button data-a="obNext" class="primary">${['Настроить за минуту','Дальше','Дальше','Готово — к тренировкам'][st]}</button></div>`;
}

/* ================= РЕНДЕР ================= */
const $=id=>document.getElementById(id);
function overlay(el,on,html){
  const was=el.classList.contains('on');
  if(on){el.innerHTML=html;if(!was)el.classList.add('on');}
  else if(was){el.classList.remove('on');el.innerHTML='';}
}
function render(){
  const keep={};document.querySelectorAll('[data-scroll]').forEach(e=>keep[e.dataset.scroll]=e.scrollTop);
  const c=ctx();
  $('main').innerHTML=S.tab==='today'?viewToday(c):S.tab==='program'?viewProgram(c):S.tab==='prog'?viewProg(c):viewSettings();
  $('nav').innerHTML=viewNav();
  overlay($('sheet'),!!S.sheet,S.sheet?viewSheet():'');
  if(S.wk){$('wk').classList.add('on');$('wkInner').innerHTML=viewWk();const L=wkLive();overlay($('rest'),L.resting,L.resting?viewRest():'');}
  else{$('wk').classList.remove('on');$('wkInner').innerHTML='';overlay($('rest'),false);}
  overlay($('onb'),!S.onboarded,!S.onboarded?viewOnb():'');
  const nb=build(c.dec.week,c.dec.dayIndex);
  overlay($('notif'),S.notif,`<img src="icons/icon-192.png" alt="" style="flex:none;width:36px;height:36px;border-radius:50%"><div style="flex:1;min-width:0"><div class="muted" style="font-size:12px">Тренировки · сейчас</div><div style="font-weight:700;font-size:15px;margin-top:2px">Сегодня: День ${nb.code} · ${esc(nb.dayName)}</div><div style="color:var(--soft);font-size:13.5px">Неделя ${c.dec.week} · ~50 мин. Нажми, чтобы начать.</div></div>`);
  document.querySelectorAll('[data-scroll]').forEach(e=>{if(keep[e.dataset.scroll]!=null)e.scrollTop=keep[e.dataset.scroll];});
}
// точечное обновление тикающих значений
function live(){
  const L=wkLive(),t=(id,v)=>{const e=$(id);if(e&&e.textContent!==String(v))e.textContent=v;};
  t('wkElapsed',L.elapsed);t('restLeft',L.restLeft);t('mainBtn',L.mainLabel);
  const r=$('ring');if(r)r.setAttribute('stroke-dashoffset',L.ring);
  if(L.ex&&L.ex.hold){t('holdClock',L.holdClock);t('holdVal',L.val);const b=$('holdBar');if(b){b.style.width=L.holdPct;b.style.background=L.holdBar;}}
}
let lastTick=null;
setInterval(()=>{
  const wk=S.wk;if(!wk)return;
  const now=Date.now();S.now=now;
  if(wk.restEnd){
    const left=Math.ceil((wk.restEnd-now)/1000);
    if(left<=3&&left>0&&lastTick!==left){lastTick=left;beep(660,.08);}
    if(now>=wk.restEnd){lastTick=null;signal();wk.restEnd=null;render();return;}
  }
  if(wk.holdStart&&!wk.holdBeeped&&(now-wk.holdStart)/1000>=wk.holdTarget){signal();wk.holdBeeped=true;}
  live();
},250);

/* ================= ДЕЙСТВИЯ ================= */
let notifT=null;
function setOffset(o){save('trn_offset',String(o));set({offset:o});}
function setRemind(p){S.remind={...S.remind,...p};save('trn_remind',S.remind);render();}
function stepVal(sign){
  const wk=S.wk,i=wk.step-1,ex=build(wk.week,wk.di).exercises[i],a=wk.val.slice();
  a[i]=Math.max(0,a[i]+sign*(ex.hold?5:1));setWk({val:a});
}
const A={
  tab:d=>{set({tab:d.k,sheet:null});toTop();},
  backToday:()=>{set({browseWeek:null,browseDay:0,openEx:-1});toTop();},
  // в день отдыха — открыть пропущенную; в тренировочный — сдвинуть график на одну назад
  catchUp:()=>{
    const c=ctx();save('trn_dismiss',c.lastISO);
    if(c.rest)set({dismissed:c.lastISO,browseWeek:c.missed.week,browseDay:c.missed.dayIndex,openEx:-1});
    else{save('trn_offset',String(S.offset-1));set({dismissed:c.lastISO,offset:S.offset-1});}
  },
  dismissMissed:()=>{const c=ctx();save('trn_dismiss',c.lastISO);set({dismissed:c.lastISO});},
  peekPrev:()=>{const pv=decode(Math.max(0,session().idx-1));set({browseWeek:pv.week,browseDay:pv.dayIndex,openEx:-1});},
  day:d=>set({browseDay:+d.i,openEx:-1}),
  startWk:startWorkout,
  warm:()=>set({openWarm:!S.openWarm}), cool:()=>set({openCool:!S.openCool}), how:()=>set({openHow:!S.openHow}),
  ex:d=>set({openEx:S.openEx===+d.i?-1:+d.i}),
  sheet:d=>set({sheet:{di:+d.di,ei:+d.ei,week:+d.w}}),
  closeSheet:()=>set({sheet:null}),
  week:d=>{set({tab:'today',browseWeek:+d.n,browseDay:0,openEx:-1});toTop();},
  progTab:d=>set({progTab:d.k}),
  shift:d=>setOffset(S.offset+(+d.n)),
  resetOffset:()=>setOffset(0),
  restSec:d=>{save('trn_rest',d.n);set({restSec:+d.n});},
  remind:()=>setRemind({on:!S.remind.on}),
  time:d=>setRemind({time:d.k}),
  notifShow:()=>{clearTimeout(notifT);set({notif:true});notifT=setTimeout(()=>set({notif:false}),5000);},
  notifTap:()=>{clearTimeout(notifT);set({notif:false,tab:'today',browseWeek:null});},
  fx:d=>{save('trn_'+d.k,S[d.k]?'0':'1');set({[d.k]:!S[d.k]});},
  testSound:()=>signal(),
  redoOnb:()=>{save('trn_onboarded','0');set({onboarded:false,obStep:0,obStartPick:null});},
  obBack:()=>set({obStep:S.obStep-1}),
  obNext:()=>{
    if(S.obStep<3)return set({obStep:S.obStep+1});
    const st=obStart();save('trn_onboarded','1');save('trn_start',st);save('trn_gear',S.gear);
    set({onboarded:true,obStep:0,start:st,tab:'today'});toTop();
  },
  obPick:d=>set({obStartPick:d.k}),
  gear:d=>{const i=+d.i;set({gear:S.gear.includes(i)?S.gear.filter(x=>x!==i):[...S.gear,i]});},
  // тренировка
  wkClose:()=>set({wk:null}),
  wkPrev:()=>setWk({step:S.wk.step-1,restEnd:null,holdStart:null}),
  wkMain:mainAction,
  setTap:d=>{const k=+d.i,wk=S.wk,i=wk.step-1;if(k<wk.reps[i].length){const r=wk.reps.slice();r[i]=r[i].slice(0,k);setWk({reps:r,restEnd:null});}},
  inc:()=>stepVal(1), dec:()=>stepVal(-1),
  hold:()=>{const wk=S.wk,i=wk.step-1,ex=build(wk.week,wk.di).exercises[i];
    if(wk.holdStart){const a=wk.val.slice();a[i]=Math.round((Date.now()-wk.holdStart)/1000);setWk({holdStart:null,val:a});}
    else setWk({holdStart:Date.now(),holdTarget:ex.hi,holdBeeped:false});},
  addRest:()=>setWk({restEnd:S.wk.restEnd+15000,restTotal:S.wk.restTotal+15}),
  skipRest:()=>setWk({restEnd:null})
};
const C={
  setStart:v=>{if(!v)return;save('trn_start',v);set({start:v});},
  obSetStart:v=>{if(v)set({obStartPick:v});}
};
document.addEventListener('click',e=>{
  unlockAudio();
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f)f(el.dataset);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el.value);});

render();

/* регистрация service worker — нужна, чтобы Chrome предлагал установку и для офлайна */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js');});
}
</script>
</body>
</html>
